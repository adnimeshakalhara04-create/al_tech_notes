</style></head><body data-build="v37-drive-images-300-final"><main class="app"><nav class="tabs"><button class="tab" data-tab="practice">🎯 පුහුණුව</button><button class="tab" data-tab="questions">📚 සියලු ප්‍රශ්න</button><button class="tab" data-tab="memory">🧠 මතක උත්තර</button></nav><section id="practice" class="view"><div class="hero"><h1>ET Recall • Unit 01</h1><div class="sub">Q001–Q300 • Drive lesson images • Recall practice</div><div id="status" class="ok">Data loading…</div><div id="pchips" class="chips"></div></div><div class="baskets"><button id="bad" class="basket bad">🧠 බැරි<span id="bc">0</span></button><button id="good" class="basket">⚡ පුළුවන්<span id="gc">0</span></button></div><div class="stats"><div class="stat"><small>මුළු ප්‍රශ්න</small><b id="total">0</b></div><div class="stat"><small>Mastery</small><b id="pct">0%</b></div><div class="stat"><small>Section</small><b id="section">ALL</b></div><div class="stat"><small>Images</small><b id="images">0</b></div></div><div class="actions"><button id="random" class="btn o">🎲 Random</button><button id="imagePractice" class="btn">🖼️ Image Questions</button><button id="reset" class="btn">↺ Reset</button></div></section><section id="questions" class="view"><div class="hero"><h1>📚 සියලු ප්‍රශ්න</h1><div class="sub">300 questions + theory answers + lesson images</div></div><div class="tool"><input id="qs" class="search" placeholder="ප්‍රශ්නයක් / වචනයක් සොයන්න…"><div id="qchips" class="chips"></div><div id="qc" class="count"></div></div><div id="ql" class="list"></div></section><section id="memory" class="view"><div class="hero"><h1>🧠 මතක උත්තර</h1><div class="sub">Memory answer + Theory answer</div></div><div class="tool"><input id="ms" class="search" placeholder="ප්‍රශ්නයක් / වචනයක් සොයන්න…"><div id="mchips" class="chips"></div><div id="mc" class="count"></div></div><div id="ml" class="list"></div></section></main><div id="modal" class="modal"><div class="box"><div class="top"><b id="mode"></b><button id="close (()=>{const $=x=>document.getElementById(x),C=window.CARDS||[],S=['ALL','1.1','1.2','1.3','1.4','1.5'],K='et-u1-v37-drive-images',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let st={};try{st=JSON.parse(localStorage.getItem(K)||'{}')}catch{}C.forEach(c=>{if(!['bad','good'].includes(st[c.id]))st[c.id]='bad'});let ps='ALL',qs='ALL',ms='ALL',qq='',mq='',queue=[],idx=0,cur=null,seen=false,answer=false;const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch{}},sel=(s)=>C.filter(c=>s==='ALL'||c.s===s),easy=c=>c.m||c.a;

function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function open(mode){let a=sel(ps);queue=shuffle(a.filter(c=>mode==='random'||(mode==='image'?!!c.image:st[c.id]===mode)).slice());idx=0;$('mode').textContent=mode==='bad'?'බැරි Basket':mode==='good'?'පුළුවන් Basket':mode==='image'?'🖼️ Image Practice':'Random Practice';$('modal').classList.add('open');document.body.style.overflow='hidden';show()}
function show(){if(!queue.length){$('ft').textContent='✨ මේ basket එක හිස්.';$('visual').hidden=true;$('flip').disabled=$('mb').disabled=$('mg').disabled=true;return}cur=queue[idx%queue.length];seen=answer=false;$('card').className='card';$('sec').textContent=cur.s+' • QUESTION';$('counter').textContent=(idx+1)+' / '+queue.length;$('ft').textContent=cur.q;$('flip').disabled=false;$('flip').textContent='පිළිතුර බලන්න ↻';$('mb').disabled=$('mg').disabled=true;if(cur.image){$('visual').style.cssText=style(cur);$('visual').hidden=false}else $('visual').hidden=true}
function flip(){if(!cur)return;answer=!answer;if(answer){seen=true;$('card').className='card answer';$('sec').textContent='ANSWER';$('ft').textContent=cur.a;$('flip').textContent='ප්‍රශ්නය බලන්න ↺';$('mb').disabled=$('mg').disabled=false}else{showQuestion()}}function showQuestion(){$('card').className='card';$('sec').textContent=cur.s+' • QUESTION';$('ft').textContent=cur.q;$('flip').textContent='පිළිතුර බලන්න ↻'}function mark(v){if(!cur||!seen)return;st[cur.id]=v;save();stats();queue.splice(idx,1);if(idx>=queue.length)idx=0;show()}
$('bad').onclick=()=>open('bad');$('good').onclick=()=>open('good');$('random').onclick=()=>open('random');$('imagePractice').onclick=()=>open('image');$('flip').onclick=flip;$('mb').onclick=()=>mark('bad');$('mg').onclick=()=>mark('good');$('next').onclick=()=>{if(queue.length){idx=(idx+1)%queue.length;show()}};$('close').onclick=()=>{$('modal').classList.remove('open');document.body.style.overflow=''};$('reset').onclick=()=>{if(confirm('Progress reset කරන්නද?')){C.forEach(c=>st[c.id]='bad');save();stats()}};$('qs').oninput=e=>{qq=e.target.value;renderQ()};$('ms').oninput=e=>{mq=e.target.value;renderM()};
const ids=C.map(c=>c.id),u=new Set(ids),exp=Array.from({length:300},(_,i)=>'q'+String(i+1).padStart(3,'0')),missing=exp.filter(x=>!u.has(x)),dupes=ids.filter((x,i)=>ids.indexOf(x)!==i),ok=C.length===300&&u.size===300&&!missing.length&&!dupes.length;$('status').textContent=ok?`✅ 300 / 300 loaded • ${C.filter(c=>c.image).length} image-linked questions • no duplicates`:`⚠️ ${C.length}/300 • Missing: ${missing.join(', ')||'none'} • Duplicates: ${[...new Set(dupes)].join(', ')||'none'}`;if(!ok)$('status').classList.add('badmsg');pchips();qchips();mchips();stats();tab('practice');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));})();
